[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeek-beacon-floor"
version = "0.1.0"
description = "Measures where beacon detection stops working, in intervals observed and jitter rather than hours of capture."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nilay Dave" }]
keywords = ["zeek", "beacon", "detection", "threat-hunting", "c2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# ruff is pinned exactly. Its formatter changes how it joins lines between
# releases, and CI gates on "ruff format --check", so an unpinned floor made
# that gate depend on the day the build ran rather than on the code: 28 files
# formatted under 0.6 were reported as unformatted under 0.17.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.1"]

[project.scripts]
zbf = "zbf.cli:main"

[project.urls]
Homepage = "https://github.com/nilay-dave/zeek-beacon-floor"
Documentation = "https://nilay-dave.github.io/zeek-beacon-floor/"
Issues = "https://github.com/nilay-dave/zeek-beacon-floor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
